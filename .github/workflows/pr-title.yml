name: pr-title

# Pull requests are squash-merged and the title becomes the commit on main, so the
# title is what must follow Conventional Commits (https://www.conventionalcommits.org).
# The branch's own commits are not checked: they do not reach main.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Title follows Conventional Commits
        env:
          # Through the environment, never inlined into the script: the title is
          # attacker-controlled text.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          pattern="^($types)(\([a-z0-9._/,-]+\))?!?: [^ ].*[^. ]\$"
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
            exit 0
          fi
          echo "::error title=Pull request title::'$TITLE' is not a Conventional Commits subject."
          echo "Expected: type(optional-scope)!: description"
          echo "  type: ${types//|/, }"
          echo "  scope: lowercase, e.g. (gateway), (deps); '!' marks a breaking change"
          echo "  description: starts after ': ', no trailing period"
          echo "Examples: 'fix(gateway): keep the stream open on slow vendors', 'feat!: drop the v1 settings API'"
          exit 1
