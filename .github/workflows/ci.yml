name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: docker.io/yoonaowo/llm-proxy-backend
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        # testcontainers starts a throwaway Postgres through the runner's Docker.
        run: go test ./... -race
      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code
      - name: README matches docker-compose.minimal.yml
        run: scripts/check-readme-compose.sh
      - name: Compose files are valid
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.minimal.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
          docker compose -f docker-compose.minimal.yml -f docker-compose.build.yml config -q

  # Pull requests: build both platforms, never log in, never push.
  image-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: VERSION=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha

  # main -> edge, sha-<7>; vX.Y.Z -> X.Y.Z, X.Y, X (from 1.0.0 on), latest.
  publish:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: test
    environment: dockerhub
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # auto: latest only alongside a semver tag, i.e. on vX.Y.Z pushes.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=llm-proxy-backend
            org.opencontainers.image.description=llm-proxy gateway: shared Claude and ChatGPT subscriptions behind personal API keys
            org.opencontainers.image.licenses=MIT
      - id: build
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test every platform by digest
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          # Without configuration the binary must start and refuse with its known
          # error: proof that it executes on the platform, not just that it exists.
          # Each platform runs by its own manifest digest from the pushed index: the
          # runner's image store cannot pull an index that carries attestations.
          want='gateway: config: LLMPROXY_DATABASE_URL is required'
          declare -A uname=([linux/amd64]=x86_64 [linux/arm64]=aarch64)
          index=$(docker buildx imagetools inspect --raw "$REF")
          for platform in ${PLATFORMS//,/ }; do
            echo "::group::$platform"
            digest=$(jq -r --arg os "${platform%/*}" --arg arch "${platform#*/}" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' <<<"$index")
            [ -n "$digest" ] || { echo "::error::$platform missing from $REF"; exit 1; }
            ref="$IMAGE@$digest"
            echo "$platform: $ref"
            docker pull -q --platform "$platform" "$ref"
            set +e
            err=$(docker run --rm --platform "$platform" "$ref" 2>&1 >/dev/null)
            code=$?
            set -e
            echo "exit $code: $err"
            machine=$(docker run --rm --platform "$platform" --entrypoint uname "$ref" -m)
            echo "machine: $machine"
            [ "$machine" = "${uname[$platform]}" ] || { echo "::error::$platform: ran as $machine"; exit 1; }
            [ "$code" -eq 1 ] || { echo "::error::$platform: exit $code, want 1"; exit 1; }
            case "$err" in
              *"$want"*) ;;
              *) echo "::error::$platform: stderr lacks '$want'"; exit 1 ;;
            esac
            echo "::endgroup::"
          done
