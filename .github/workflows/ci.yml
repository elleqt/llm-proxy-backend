name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: docker.io/yoonaowo/llm-proxy-backend
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        # testcontainers starts a throwaway Postgres through the runner's Docker.
        run: go test ./... -race
      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code
      - name: README matches docker-compose.yml and .env.example
        run: scripts/check-readme-compose.sh
      - name: Compose files are valid
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.build.yml config -q

  # Pull requests: build both platforms, never log in, never push.
  image-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: VERSION=pr-${{ github.event.pull_request.number }}
          cache-from: type=gha

  # main -> edge, sha-<7>; vX.Y.Z -> X.Y.Z, X.Y, X (from 1.0.0 on), latest.
  publish:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: test
    environment: dockerhub
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # auto: latest only alongside a semver tag, i.e. on vX.Y.Z pushes.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=llm-proxy-backend
            org.opencontainers.image.description=llm-proxy gateway: shared Claude and ChatGPT subscriptions behind personal API keys
            org.opencontainers.image.licenses=MIT
      - id: build
        name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test every platform by digest
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          # Without configuration the binary must start and refuse with its known
          # error: proof that it executes on the platform, not just that it exists.
          want='gateway: config: LLMPROXY_DATABASE_URL is required'
          declare -A uname=([linux/amd64]=x86_64 [linux/arm64]=aarch64)
          for platform in ${PLATFORMS//,/ }; do
            echo "::group::$platform"
            set +e
            err=$(docker run --rm --platform "$platform" "$REF" 2>&1 >/dev/null)
            code=$?
            set -e
            echo "exit $code: $err"
            machine=$(docker run --rm --platform "$platform" --entrypoint uname "$REF" -m)
            echo "machine: $machine"
            [ "$machine" = "${uname[$platform]}" ] || { echo "::error::$platform: ran as $machine"; exit 1; }
            [ "$code" -eq 1 ] || { echo "::error::$platform: exit $code, want 1"; exit 1; }
            case "$err" in
              *"$want"*) ;;
              *) echo "::error::$platform: stderr lacks '$want'"; exit 1 ;;
            esac
            echo "::endgroup::"
          done
